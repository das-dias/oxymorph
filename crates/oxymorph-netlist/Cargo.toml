[package]
name = "oxymorph-netlist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams"]
spice = []
hspice = ["spice"]
xyce = ["spice"]
spectre = []
spectre_spice = ["spice", "spectre"]
vams = []

[[test]]
name = "parity"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams"]

[[test]]
name = "kf_fixes"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams"]

[dependencies]
oxymorph-schema = { path = "../oxymorph-schema" }
lark-rs.workspace = true
regex.workspace = true
indexmap.workspace = true

[dev-dependencies]
serde_json.workspace = true
