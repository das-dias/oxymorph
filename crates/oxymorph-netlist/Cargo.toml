[package]
name = "oxymorph-netlist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]
spice = []
hspice = ["spice"]
xyce = ["spice"]
spectre = []
spectre_spice = ["spice", "spectre"]
vams = []
systemverilog = []

[[test]]
name = "parity"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams"]

[[test]]
name = "kf_fixes"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[[test]]
name = "kf_expressions"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[[test]]
name = "kf_writers"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[[test]]
name = "kf_stimuli"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[[test]]
name = "kf_systemverilog"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[[example]]
name = "dump_corpus"
required-features = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams", "systemverilog"]

[dependencies]
oxymorph-schema = { path = "../oxymorph-schema" }
lark-rs.workspace = true
regex.workspace = true
indexmap.workspace = true
serde_json.workspace = true
