[package]
name = "oxymorph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["spice", "hspice", "xyce", "spectre", "spectre_spice", "vams"]
spice = ["oxymorph-netlist/spice"]
hspice = ["oxymorph-netlist/hspice"]
xyce = ["oxymorph-netlist/xyce"]
spectre = ["oxymorph-netlist/spectre"]
spectre_spice = ["oxymorph-netlist/spectre_spice"]
vams = ["oxymorph-netlist/vams"]

[dependencies]
oxymorph-schema = { path = "../oxymorph-schema" }
oxymorph-netlist = { path = "../oxymorph-netlist" }
